<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFI FOOD - VB6/Win98 Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmogqpXzirZC-aUHZrFMwutSJ5fmbyDXk",
            authDomain: "e-commarcebd.firebaseapp.com",
            databaseURL: "https://e-commarcebd-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "e-commarcebd",
            storageBucket: "e-commarcebd.firebasestorage.app",
            messagingSenderId: "799252588942",

        firebase.initializeApp(firebaseConfig);

    <style>
        /* Windows 98 / VB6 Theme Variables */
        :root {
            --w98-bg: #C0C0C0;
            --w98-shadow-dark: #808080;
            --w98-shadow-darker: #000000;
            --w98-highlight: #FFFFFF;
            --w98-title-active: #000080;
            --w98-title-text: #FFFFFF;
        }

        body {
            font-family: 'Tahoma', 'Verdana', 'MS Sans Serif', sans-serif;
            background-color: #008080; /* Classic Teal Desktop */
            font-size: 12px;
            color: #000;
        }

        /* Window/Panel Styles */
        .win98-window {
            background: var(--w98-bg);
            border-top: 2px solid var(--w98-highlight);
            border-left: 2px solid var(--w98-highlight);
            border-right: 2px solid var(--w98-shadow-darker);
            border-bottom: 2px solid var(--w98-shadow-darker);
            box-shadow: inset -1px -1px 0 var(--w98-shadow-dark), inset 1px 1px 0 #DFDFDF;
        }
        
        .win98-titlebar {
            background: linear-gradient(90deg, #000080 0%, #1084D0 100%);
            color: var(--w98-title-text);
            font-weight: bold;
            padding: 3px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .win98-inset {
            background: #FFFFFF;
            border-top: 2px solid var(--w98-shadow-dark);
            border-left: 2px solid var(--w98-shadow-dark);
            border-right: 2px solid var(--w98-highlight);
            border-bottom: 2px solid var(--w98-highlight);
            box-shadow: inset 1px 1px 0 var(--w98-shadow-darker);
        }

        .win98-outset {
            background: var(--w98-bg);
            border-top: 2px solid var(--w98-highlight);
            border-left: 2px solid var(--w98-highlight);
            border-right: 2px solid var(--w98-shadow-dark);
            border-bottom: 2px solid var(--w98-shadow-dark);
            box-shadow: inset -1px -1px 0 var(--w98-shadow-darker), inset 1px 1px 0 #DFDFDF;
        }

        /* Button Style */
        .w98-btn {
            background: var(--w98-bg);
            border-top: 2px solid var(--w98-highlight);
            border-left: 2px solid var(--w98-highlight);
            border-right: 2px solid var(--w98-shadow-dark);
            border-bottom: 2px solid var(--w98-shadow-dark);
            box-shadow: inset -1px -1px 0 var(--w98-shadow-darker), inset 1px 1px 0 #DFDFDF;
            padding: 4px 12px;
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            cursor: pointer;
            color: #000;
            min-width: 70px;
        }
        .w98-btn:active {
            border-top: 2px solid var(--w98-shadow-dark);
            border-left: 2px solid var(--w98-shadow-dark);
            border-right: 2px solid var(--w98-highlight);
            border-bottom: 2px solid var(--w98-highlight);
            box-shadow: inset 1px 1px 0 var(--w98-shadow-darker);
            padding: 5px 11px 3px 13px;
        }

        /* Input/Select/Textarea Style */
        .w98-input, .w98-select, .w98-textarea {
            background: #FFFFFF;
            border-top: 2px solid var(--w98-shadow-dark);
            border-left: 2px solid var(--w98-shadow-dark);
            border-right: 2px solid var(--w98-highlight);
            border-bottom: 2px solid var(--w98-highlight);
            box-shadow: inset 1px 1px 0 var(--w98-shadow-darker);
            padding: 3px;
            font-family: 'Tahoma', sans-serif;
            font-size: 12px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        /* Table Style */
        .w98-table {
            width: 100%;
            border-collapse: collapse;
            background: #FFFFFF;
            border: 2px solid var(--w98-shadow-darker);
        }
        .w98-table th {
            background: var(--w98-bg);
            border-bottom: 1px solid var(--w98-shadow-darker);
            border-right: 1px solid var(--w98-shadow-dark);
            padding: 4px;
            text-align: left;
            font-weight: bold;
        }
        .w98-table td {
            border-bottom: 1px solid var(--w98-shadow-dark);
            border-right: 1px solid var(--w98-shadow-dark);
            padding: 4px;
        }

        /* Scrollbar Retro Style */
        ::-webkit-scrollbar { width: 16px; height: 16px; }
        ::-webkit-scrollbar-track { background: #DFDFDF; border: 1px solid var(--w98-shadow-dark); }
        ::-webkit-scrollbar-thumb { background: var(--w98-bg); border-top: 2px solid var(--w98-highlight); border-left: 2px solid var(--w98-highlight); border-right: 2px solid var(--w98-shadow-darker); border-bottom: 2px solid var(--w98-shadow-darker); }
        ::-webkit-scrollbar-corner { background: var(--w98-bg); }

        /* Menu Item */
        .menu-item {
            padding: 4px 10px;
            cursor: pointer;
            color: #000;
            text-decoration: none;
            display: block;
        }
        .menu-item:hover { background: var(--w98-title-active); color: #FFF; }
        .menu-item.active { background: var(--w98-title-active); color: #FFF; }

        /* Invoice Specific CSS (Optimized for Print) */
        .invoice-box { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 0; box-shadow: 0 0 15px rgba(0, 0, 0, 0.15); border: 2px solid #000; color: #000; font-family: 'Courier New', Courier, monospace; margin-bottom: 40px; }
        .copy-header { text-align: center; font-size: 1.2rem; font-weight: bold; color: #000; border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        .page-break { page-break-after: always; }
        
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 20px; }
        .invoice-header .company-info { display: flex; gap: 10px; align-items: center; max-width: 60%; }
        .invoice-header .company-logo { width: 75px; height: 75px; min-width: 75px; border: 1px solid #000; object-fit: cover; }
        .invoice-header .company-text h2 { color: #000; font-size: 1.4rem; margin: 0 0 3px 0; font-weight: bold; line-height: 1.1; }
        .invoice-header .company-text p { font-size: 0.75rem; color: #000; line-height: 1.2; margin: 0; }
        
        .invoice-details { text-align: right; }
        .invoice-details h1 { color: #000; font-size: 1.6rem; margin-bottom: 5px; }
        .customer-info { margin-bottom: 25px; background: transparent; padding: 15px; border: 1px solid #000; border-radius: 0; }
        .customer-info h3 { font-size: 1rem; color: #000; margin-bottom: 5px; }
        .customer-info p { font-size: 0.9rem; color: #000; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        .invoice-table th, .invoice-table td { padding: 12px; text-align: left; border-bottom: 1px solid #000; font-size: 0.95rem; color: #000; }
        .invoice-table th { background-color: transparent; color: #000; border-bottom: 2px solid #000; border-top: 2px solid #000; font-weight: bold; }
        .invoice-table th.right-align, .invoice-table td.right-align { text-align: right; }
        .invoice-table th.center-align, .invoice-table td.center-align { text-align: center; }
        .invoice-table td:last-child { font-weight: 600; }
        .total-section { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .total-table { width: 300px; }
        .total-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.95rem; border-bottom: 1px solid #000; color: #000; }
        .total-row.grand-total { font-weight: bold; font-size: 1.1rem; color: #000; border-bottom: 2px solid #000; border-top: 2px solid #000; margin-top: 5px; padding: 10px 0; }
        .signature-area { display: flex; justify-content: space-between; margin-top: 60px; margin-bottom: 20px; }
        .signature-block { width: 45%; text-align: center; }
        .signature-line { border-top: 1px solid #000; margin-bottom: 5px; }
        .signature-text { font-size: 0.9rem; font-weight: bold; color: #000; }
        .invoice-footer { text-align: center; border-top: 1px solid #000; padding-top: 15px; font-size: 0.85rem; color: #000; }
        .print-btn { display: block; width: 100%; background-color: #000; color: #fff; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 0; cursor: pointer; margin-top: 20px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #000; font-weight: bold; text-decoration: underline; cursor: pointer; }
        .status-badge { padding: 4px 8px; border-radius: 0; font-size: 0.75rem; font-weight: bold; border: 1px solid #000; }
        .status-pending { background: #FEF3C7; color: #000; }
        .status-shipped { background: #DBEAFE; color: #000; }
        .status-delivered { background: #D1FAE5; color: #000; }
        .status-cancelled { background: #FEE2E2; color: #000; }
        .status-returned { background: #E0E7FF; color: #000; }

        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { margin: 0; padding: 0; background: #FFF; }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
            .no-print { display: none !important; }
            .invoice-box { box-shadow: none; border: none; margin: 0; padding: 0; width: 100%; max-width: 100%; border-bottom: 2px dashed #000; }
            #print-area * { color: #000 !important; background: transparent !important; border-color: #000 !important; box-shadow: none !important; text-shadow: none !important; }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="win98-window w-full max-w-md">
            <div class="win98-titlebar">
                <span><i class="fas fa-bread-slice mr-2"></i> RAFI FOOD - Login</span>
                <div class="flex space-x-1">
                    <button class="w98-btn" style="padding: 0 5px; min-width: 20px;">_</button>
                    <button class="w98-btn" style="padding: 0 5px; min-width: 20px;">X</button>
                </div>
            </div>
            <div class="p-6">
                <form id="login-form" class="space-y-4">
                    <div class="flex justify-center mb-4">
                        <img src="https://www.appcreator24.com/srv/imgs/gen/4146836_ico.png?ts=1786242930" alt="Logo" class="w-20 h-20 border-2 border-black object-cover">
                    </div>
                    <h1 class="text-center text-xl font-bold mb-4">Sales & Distribution Management</h1>
                    <div>
                        <label class="block mb-1">Username:</label>
                        <input type="text" id="username" class="w98-input" placeholder="admin" required>
                    </div>
                    <div>
                        <label class="block mb-1">Password:</label>
                        <input type="password" id="password" class="w98-input" placeholder="admin" required>
                    </div>
                    <div class="flex justify-end space-x-2 mt-4">
                        <button type="submit" class="w98-btn">Login</button>
                        <button type="button" class="w98-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App Layout -->
    <div id="app-screen" class="hidden min-h-screen p-2">
        <div class="win98-window flex flex-col md:flex-row h-[calc(100vh-20px)]">
            
            <!-- Sidebar -->
            <aside id="sidebar" class="w-full md:w-64 win98-inset m-1 flex flex-col overflow-y-auto">
                <div class="win98-outset m-1 p-2 flex items-center space-x-2">
                    <img src="https://www.appcreator24.com/srv/imgs/gen/4146836_ico.png?ts=1786242930" alt="Logo" class="w-10 h-10 border border-black object-cover">
                    <div>
                        <h1 class="text-sm font-bold">RAFI FOOD</h1>
                        <p class="text-[10px]">Distribution System</p>
                    </div>
                </div>
                <nav class="flex-1 p-1 text-xs">
                    <div class="win98-outset m-1 mb-2">
                        <a href="#" data-page="dashboard" class="menu-item active"><i class="fas fa-tachometer-alt w-4"></i> Dashboard</a>
                    </div>
                    
                    <div class="px-2 py-1 font-bold text-[11px]">Sales & Distribution</div>
                    <div class="win98-outset m-1 mb-2">
                        <a href="#" data-page="order-entry" class="menu-item"><i class="fas fa-cart-plus w-4"></i> Order Entry</a>
                        <a href="#" data-page="invoices" class="menu-item"><i class="fas fa-file-invoice w-4"></i> Order History</a>
                    </div>

                    <div class="px-2 py-1 font-bold text-[11px]">Management</div>
                    <div class="win98-outset m-1 mb-2">
                        <a href="#" data-page="products" class="admin-only menu-item"><i class="fas fa-boxes w-4"></i> Product Mgmt</a>
                        <a href="#" data-page="users" class="admin-only menu-item"><i class="fas fa-user-shield w-4"></i> User Mgmt</a>
                    </div>
                    
                    <div class="px-2 py-1 font-bold text-[11px]">Reports</div>
                    <div class="win98-outset m-1 mb-2">
                        <a href="#" data-page="reports" class="menu-item"><i class="fas fa-chart-line w-4"></i> Sales & Due Reports</a>
                    </div>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <div class="flex-1 flex flex-col p-1">
                <header class="win98-titlebar mb-1">
                    <h2 id="page-title" class="text-sm font-bold">Dashboard</h2>
                    <div class="flex items-center space-x-2">
                        <button id="theme-toggle" class="text-xs hover:underline">Toggle Theme</button>
                        <span class="hidden md:block">|</span>
                        <div class="flex items-center space-x-1 cursor-pointer relative" id="profile-container">
                            <img id="nav-avatar" src="https://ui-avatars.com/api/?name=Admin&background=5C1D24&color=fff" class="w-5 h-5" alt="User">
                            <span id="user-name" class="hidden md:block text-xs">Admin</span>
                            <i class="fas fa-chevron-down text-[10px]"></i>
                            <div id="profile-menu" class="hidden absolute right-0 top-8 w-48 win98-window z-50">
                                <a href="#" onclick="openProfileSettings()" class="menu-item"><i class="fas fa-user-cog mr-2"></i> Profile Setting</a>
                                <a href="#" onclick="openChangePassword()" class="menu-item"><i class="fas fa-key mr-2"></i> Change Password</a>
                                <div class="border-t border-gray-500 my-1"></div>
                                <a href="#" onclick="logout()" class="menu-item"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                            </div>
                        </div>
                    </div>
                </header>

                <main id="main-content" class="flex-1 win98-inset p-2 overflow-y-auto bg-white"></main>
            </div>
        </div>
    </div>

    <!-- Universal Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.5);">
        <div class="win98-window w-full max-w-lg">
            <div class="win98-titlebar">
                <span id="modal-title">Modal Title</span>
                <button onclick="closeModal()" class="w98-btn" style="padding: 0 5px; min-width: 20px;">X</button>
            </div>
            <div id="modal-body" class="p-4 max-h-[80vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const State = { currentUser: null, currentPage: null, currentView: null, products: [], users: [], orders: [], cart: [] };

        // --- AUTH ---
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username === 'admin' && password === 'admin') {
                State.currentUser = { id: 'superadmin', name: 'Super Admin', role: 'ADMIN', status: 'Active' };
                showApp(); return;
            }
            const usersRef = db.ref('users');
            usersRef.once('value', (snapshot) => {
                let loggedIn = false;
                snapshot.forEach((childSnapshot) => {
                    const user = childSnapshot.val();
                    user.id = childSnapshot.key; 
                    if (user.username === username && user.password === password) {
                        if (user.status !== 'Active') return alert('User is inactive!');
                        State.currentUser = user; loggedIn = true;
                    }
                });
                if (loggedIn) showApp(); else alert('Invalid credentials!');
            });
        });

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-name').textContent = State.currentUser.name;
            const avatarUrl = State.currentUser.image || `https://ui-avatars.com/api/?name=${State.currentUser.name}&background=5C1D24&color=D4AF37`;
            document.getElementById('nav-avatar').src = avatarUrl;
            if (State.currentUser.role !== 'ADMIN') document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
            else document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
            initFirebaseListeners();
            renderPage('dashboard');
        }

        function logout() { if (confirm('Are you sure you want to logout?')) location.reload(); }
        document.getElementById('profile-container').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('profile-menu').classList.toggle('hidden'); });
        document.addEventListener('click', (e) => { const c = document.getElementById('profile-container'); if (!c.contains(e.target)) document.getElementById('profile-menu').classList.add('hidden'); });

        function openProfileSettings() {
            const u = State.currentUser;
            openModal('Profile Settings', `
                <form onsubmit="saveProfile(event)">
                    <div class="mb-3 flex flex-col items-center">
                        <img id="u_img_preview" src="${u.image || 'https://via.placeholder.com/100'}" class="w-24 h-24 mb-2 border-2 border-black">
                        <input type="file" id="p_image" accept="image/*" onchange="previewUserImage(this)" class="text-xs">
                    </div>
                    <div class="mb-3"><label class="block mb-1">Full Name:</label><input type="text" id="p_name" value="${u.name}" class="w98-input" required></div>
                    <div class="mb-3"><label class="block mb-1">Mobile:</label><input type="text" id="p_mobile" value="${u.mobile || ''}" class="w98-input"></div>
                    <div class="mb-3"><label class="block mb-1">Address:</label><textarea id="p_address" class="w98-textarea">${u.address || ''}</textarea></div>
                    <div class="flex justify-end mt-4"><button type="submit" class="w98-btn">Save Changes</button></div>
                </form>
            `);
        }
        function previewUserImage(input) { const r = new FileReader(); r.onload = (e) => document.getElementById('u_img_preview').src = e.target.result; r.readAsDataURL(input.files[0]); }
        function saveProfile(e) {
            e.preventDefault();
            const imageFile = document.getElementById('p_image').files[0];
            const data = { name: document.getElementById('p_name').value, mobile: document.getElementById('p_mobile').value, address: document.getElementById('p_address').value };
            const saveToDB = (imgUrl) => {
                if(imgUrl) data.image = imgUrl;
                if (State.currentUser.id === 'superadmin') State.currentUser = { ...State.currentUser, ...data };
                else { db.ref('users/' + State.currentUser.id).update(data); State.currentUser = { ...State.currentUser, ...data }; }
                document.getElementById('user-name').textContent = data.name;
                if(data.image) document.getElementById('nav-avatar').src = data.image;
                alert('Profile updated successfully!'); closeModal();
            };
            if(imageFile) { const r = new FileReader(); r.onload = (e) => saveToDB(e.target.result); r.readAsDataURL(imageFile); } else { saveToDB(); }
        }
        function openChangePassword() { openModal('Change Password', `<form onsubmit="savePassword(event)"><div class="mb-3"><label class="block mb-1">New Password:</label><input type="password" id="new_pass" class="w98-input" required></div><div class="flex justify-end mt-4"><button type="submit" class="w98-btn">Update Password</button></div></form>`); }
        function savePassword(e) { e.preventDefault(); const n = document.getElementById('new_pass').value; if (State.currentUser.id === 'superadmin') alert('Super Admin password cannot be changed here.'); else { db.ref('users/' + State.currentUser.id).update({ password: n }); alert('Password updated successfully!'); } closeModal(); }

        function initFirebaseListeners() {
            db.ref('products').on('value', (s) => { State.products = []; s.forEach(c => State.products.push({ id: c.key, ...c.val() })); if (State.currentPage === 'products') renderProducts(); if (State.currentPage === 'dashboard') renderDashboard(); if (State.currentPage === 'order-entry') renderOrderEntry(); });
            db.ref('users').on('value', (s) => { State.users = []; s.forEach(c => State.users.push({ id: c.key, ...c.val() })); if (State.currentPage === 'users') renderUsers(); if (State.currentPage === 'dashboard') renderDashboard(); if (State.currentPage === 'order-entry') renderOrderEntry(); if (State.currentPage === 'reports') renderReports(); });
            db.ref('orders').on('value', (s) => { State.orders = []; s.forEach(c => State.orders.push({ id: c.key, ...c.val() })); if (State.currentPage === 'invoices' && State.currentView !== 'invoice_view') renderInvoices(); if (State.currentPage === 'reports') renderReports(); });
        }

        document.querySelectorAll('.menu-item').forEach(l => l.addEventListener('click', e => { e.preventDefault(); if(l.dataset.page) renderPage(l.dataset.page); }));
        document.getElementById('theme-toggle').addEventListener('click', () => alert('You are already in the classic VB6 theme!'));

        function renderPage(page) {
            State.currentPage = page; State.currentView = null;
            document.querySelectorAll('.menu-item').forEach(l => l.classList.remove('active'));
            const a = document.querySelector(`[data-page="${page}"]`); if (a) a.classList.add('active');
            document.getElementById('main-content').innerHTML = '<div class="flex justify-center items-center h-64"><i class="fas fa-spinner fa-spin text-2xl"></i></div>';
            setTimeout(() => {
                switch(page) {
                    case 'dashboard': document.getElementById('page-title').textContent = 'Dashboard'; renderDashboard(); break;
                    case 'products': document.getElementById('page-title').textContent = 'Product Management'; renderProducts(); break;
                    case 'users': document.getElementById('page-title').textContent = 'User Management'; renderUsers(); break;
                    case 'order-entry': document.getElementById('page-title').textContent = 'Order Entry'; renderOrderEntry(); break;
                    case 'invoices': document.getElementById('page-title').textContent = 'Order History'; renderInvoices(); break;
                    case 'reports': document.getElementById('page-title').textContent = 'Sales & Due Reports'; renderReports(); break;
                }
            }, 200);
        }
        function openModal(t, h) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = h; document.getElementById('modal').classList.remove('hidden'); }

        function saveUser(e, id) {

                altMobile: val('u_alt_mobile'), email: val('u_email'), address: val('u_address'),
                nid: val('u_nid'), businessType: val('u_b_type'), tradeLicense: val('u_trade_lic'),

                empStatus: val('u_emp_status'), due: parseFloat(val('u_due') || 0), status: 'Active'
            };
            const s = (u) => {
                if(u) data.image = u;
                if (id) db.ref('users/' + id).update(data);
                else {
                    const rP = { 'ADMIN': 'RFPA', 'SALES MAN': 'RFPS', 'DEALER': 'RFPD', 'HOCKER': 'RFPH', 'RETAILER': 'RFPR' };
                    const p = rP[role] || 'RFPX';
                    const rU = State.users.filter(u => u.userCode && u.userCode.startsWith(p));

        function handleCustomerTypeChange() { const t = document.getElementById('cust_type').value; const isC = State.currentUser.role !== 'ADMIN' && State.currentUser.role !== 'SALES MAN'; if (isC) return; const fC = State.users.filter(u => u.role === t); const cS = document.getElementById('cust_id'); cS.innerHTML = fC.length ? fC.map(c => `<option value="${c.id}">${c.name} - ${c.shopName || c.mobile || 'N/A'}</option>`).join('') : '<option value="">No customers found</option>'; updatePrices(); }
        function updatePrices() { const t = document.getElementById('cust_type').value; State.products.forEach(p => { let pr = p.mrp; if(t === 'RETAILER') pr = p.rPrice; if(t === 'DEALER') pr = p.dPrice; if(t === 'HOCKER') pr = p.hPrice; const el = document.getElementById(`price_${p.id}`); if(el) el.innerText = pr; }); renderCart(); }
        function getActivePrice(p) { const t = document.getElementById('cust_type').value; if(t === 'RETAILER') return p.rPrice; if(t === 'DEALER') return p.dPrice; if(t === 'HOCKER') return p.hPrice; return p.mrp; }
        function addToCart(id) { const p = State.products.find(x => x.id === id); const e = State.cart.find(i => i.id === id); if(e) e.qty++; else State.cart.push({ id: id, name: p.name, price: getActivePrice(p), qty: 1, mrp: p.mrp }); renderCart(); calcDue(); }
        function changeQty(id, a) { let i = State.cart.find(x => x.id === id); if(i) { if(a === 'inc') i.qty++; if(a === 'dec') i.qty--; if(i.qty <= 0) State.cart = State.cart.filter(x => x.id !== id); } renderCart(); calcDue(); }
        function renderCart() { const cT = document.getElementById('cart-table'); if(!cT) return; if(State.cart.length === 0) cT.innerHTML = `<tr><td colspan="3" class="text-center p-4">Cart is empty</td></tr>`; else cT.innerHTML = State.cart.map(i => `<tr class="border-b border-gray-400"><td class="py-1">${i.name}</td><td class="py-1 text-center"><button onclick="changeQty('${i.id}', 'dec')" class="w98-btn" style="padding: 0 4px; min-width: 0;">-</button> ${i.qty} <button onclick="changeQty('${i.id}', 'inc')" class="w98-btn" style="padding: 0 4px; min-width: 0;">+</button></td><td class="py-1 text-right">৳${i.qty * i.price}</td></tr>`).join(''); let g = State.cart.reduce((s, i) => s + (i.qty * i.price), 0); document.getElementById('gross_total').innerText = `৳ ${g.toFixed(2)}`; }
        function calcDue() { let g = State.cart.reduce((s, i) => s + (i.qty * i.price), 0); let p = parseFloat(document.getElementById('paid_amt').value) || 0; document.getElementById('final_due').innerText = `৳ ${(g - p).toFixed(2)}`; }
        function generateInvoiceNo() { const n = new Date(); const y = n.getFullYear(); const m = String(n.getMonth() + 1).padStart(2, '0'); const p = `RFP${y}${m}`; const mO = State.orders.filter(o => o.invoiceNo && o.invoiceNo.startsWith(p)); let mS = 0; mO.forEach(o => { const s = parseInt(o.invoiceNo.slice(-2)); if (s > mS) mS = s; }); return `${p}${String(mS + 1).padStart(2, '0')}`; }
        function submitOrder() {
            if(State.cart.length === 0) return alert('Cart is empty!');
            const cId = document.getElementById('cust_id').value; const c = State.users.find(u => u.id === cId); if(!c) return alert('Please select a customer!');
            const g = State.cart.reduce((s, i) => s + (i.qty * i.price), 0); const p = parseFloat(document.getElementById('paid_amt').value) || 0; const d = g - p;
            const oD = { 
                invoiceNo: generateInvoiceNo(), 
                customerId: cId, customerName: c.name, customerShopName: c.shopName || 'N/A', 
                customerMobile: c.mobile || 'N/A', customerAddress: c.address || 'N/A', 
                customerType: document.getElementById('cust_type').value, items: State.cart, 
                grossTotal: g, paid: p, due: d, orderDate: new Date().toISOString(), status: 'Pending',
                entryBy: State.currentUser.userCode || State.currentUser.name
            };
            db.ref('orders').push(oD).then(() => { const nD = (c.due || 0) + d; db.ref('users/' + cId).update({ due: nD }); alert('Order Saved! Invoice No: ' + oD.invoiceNo); renderPage('invoices'); });
        }

        function renderInvoices() {
            const iA = ['ADMIN', 'SALES MAN'].includes(State.currentUser.role); let oS = State.orders; if (!iA) oS = State.orders.filter(o => o.customerId === State.currentUser.id);
            const sC = (s) => `status-${s ? s.toLowerCase() : 'pending'}`;
            const r = oS.length ? oS.map(o => `<tr><td>${o.invoiceNo || 'N/A'}</td><td>${new Date(o.orderDate).toLocaleDateString()}</td>${iA ? `<td>${o.customerName}</td>` : ''}<td>৳${o.grossTotal}</td><td>৳${o.due}</td><td class="text-center">${iA ? `<select onchange="updateStatus('${o.id}', this.value)" class="w98-select text-xs"><option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option><option value="Shipped" ${o.status==='Shipped'?'selected':''}>Shipped</option><option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option><option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select>` : `<span class="status-badge ${sC(o.status)}">${o.status || 'Pending'}</span>`}</td><td class="text-center whitespace-nowrap"><button onclick="viewInvoice('${o.id}')" class="w98-btn" style="padding: 2px 6px;">View</button>${iA ? ` <button onclick="processReturn('${o.id}')" class="w98-btn" style="padding: 2px 6px;">Return</button>` : ''}${State.currentUser.role === 'ADMIN' ? ` <button onclick="deleteOrder('${o.id}')" class="w98-btn" style="padding: 2px 6px;">Del</button>` : ''}</td></tr>`).join('') : `<tr><td colspan="7" class="text-center p-4">No orders found.</td></tr>`;
            document.getElementById('main-content').innerHTML = `<div class="win98-window p-2"><h3 class="font-bold mb-2">Order History</h3><div class="win98-inset p-1 overflow-x-auto"><table class="w98-table text-xs"><thead><tr><th>Invoice No</th><th>Date</th>${iA ? '<th>Customer</th>' : ''}<th>Total</th><th>Due</th><th class="text-center">Status</th><th class="text-center">Action</th></tr></thead><tbody>${r}</tbody></table></div></div>`;
        }
        function updateStatus(id, s) { db.ref('orders/' + id).update({ status: s }); alert(`Status updated to: ${s}`); }
        function processReturn(id) {
            const o = State.orders.find(x => x.id === id); if(!o) return alert('Order not found!');
            const iH = o.items.map((i, idx) => `<tr><td>${i.name}</td><td class="text-center">${i.qty}</td><td class="text-center"><input type="number" id="ret_qty_${idx}" min="0" max="${i.qty}" value="0" class="w98-input" style="width: 60px; text-align: center;"></td></tr>`).join('');
            openModal('Process Return / Adjustment', `<form onsubmit="submitReturn(event, '${id}')"><p class="text-xs mb-2">Enter returned quantity for each item.</p><div class="win98-inset p-1 mb-2"><table class="w98-table text-xs"><thead><tr><th>Product</th><th class="text-center">Ordered</th><th class="text-center">Return Qty</th></tr></thead><tbody>${iH}</tbody></table></div><div class="flex justify-end"><button type="submit" class="w98-btn">Confirm Return</button></div></form>`);
        }
        function submitReturn(e, id) {
            e.preventDefault(); const o = State.orders.find(x => x.id === id); if(!o) return;
            let nG = 0, hR = false; const uI = o.items.map((i, idx) => { const rQ = parseInt(document.getElementById(`ret_qty_${idx}`).value) || 0; if(rQ > 0) hR = true; if(rQ > i.qty) { alert(`Return quantity cannot exceed ordered quantity for ${i.name}`); throw new Error('Invalid'); } const nQ = i.qty - rQ; nG += (nQ * i.price); return { ...i, qty: nQ }; });
            if(!hR) return alert('No return quantity entered.');
            const rA = o.grossTotal - nG; const nD = o.due - rA;
            if (o.customerId) { const c = State.users.find(u => u.id === o.customerId); if (c) { const nCD = (c.due || 0) - rA; db.ref('users/' + c.id).update({ due: nCD }); } }
            db.ref('orders/' + id).update({ items: uI, grossTotal: nG, due: nD, status: 'Returned' }).then(() => { alert('Return processed! Amount adjusted.'); closeModal(); renderPage('invoices'); });
        }
        function deleteOrder(id) { const o = State.orders.find(x => x.id === id); if (!o) return alert('Order not found!'); if (confirm(`Delete Invoice ${o.invoiceNo}?`)) { if (o.customerId && o.due) { const c = State.users.find(u => u.id === o.customerId); if (c) { const nD = (c.due || 0) - o.due; db.ref('users/' + c.id).update({ due: nD }); } } db.ref('orders/' + id).remove().then(() => { alert('Order deleted!'); if (State.currentView === 'invoice_view') renderPage('invoices'); }); } }
        function toBn(n) { const b = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯']; return String(n).replace(/[0-9]/g, d => b[d]); }
        function formatBnDate(d) { const t = new Date(d); const m = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর']; return `${toBn(t.getDate())} ${m[t.getMonth()]}, ${toBn(t.getFullYear())}`; }
        function translateStatus(s) { const m = { 'Pending': 'পেন্ডিং', 'Shipped': 'প্রেরিত', 'Delivered': 'ডেলিভার্ড', 'Cancelled': 'বাতিল', 'Returned': 'রিটার্ন/এডজাস্টেড' }; return m[s] || 'পেন্ডিং'; }
        function viewInvoice(id) {
            State.currentView = 'invoice_view'; const o = State.orders.find(x => x.id === id); if(!o) return alert('Invoice not found!');
            const gC = (t) => { 
                const iH = o.items.map((i, idx) => `<tr><td class="center-align">${toBn(idx + 1)}</td><td>${i.name}</td><td class="right-align">${toBn(i.mrp.toFixed(2))}</td><td class="center-align">${toBn(i.qty)}</td><td class="right-align">${toBn(i.price.toFixed(2))}</td><td class="right-align">${toBn((i.qty * i.price).toFixed(2))}</td></tr>`).join(''); 
                return `
                <div class="invoice-box">
                    <h2 class="copy-header">${t}</h2>
                    <div class="invoice-header">
                        <div class="company-info">
                            <img src="https://www.appcreator24.com/srv/imgs/gen/4146836_ico.png?ts=1786242930" alt="Logo" class="company-logo">
                            <div class="company-text">
                                <h2>Rafi Food Product</h2>
                                <p>প্রিমিয়াম কোয়ালিটি বেকারি ও ফুড আইটেম</p>
                                <p>ঠিকানা: Mosjid para Chuadanga, Chuadanga sadar-7200</p>
                                <p>ফোন: +৮৮০ 1756144900</p>
                                <p>ইমেইল: rafifoodproducts@gmail.com</p>
                            </div>
                        </div>
                        <div class="invoice-details">
                            <h1>INVOICE</h1>
                            <p><strong>ইনভয়েস নম্বর:</strong> ${o.invoiceNo || 'N/A'}</p>
                            <p><strong>তারিখ:</strong> ${formatBnDate(o.orderDate)}</p>
                            <p><strong>স্ট্যাটাস:</strong> ${translateStatus(o.status)}</p>
                        </div>
                    </div>
                    <div class="customer-info">
                        <h3>গ্রাহকের বিবরণ:</h3>
                        <p><strong>নাম:</strong> ${o.customerName}</p>
                        <p><strong>দোকানের নাম:</strong> ${o.customerShopName}</p>
                        <p><strong>ঠিকানা:</strong> ${o.customerAddress}</p>
                        <p><strong>মোবাইল:</strong> ${toBn(o.customerMobile)}</p>
                    </div>
                    <table class="invoice-table">
                        <thead><tr><th class="center-align">SL</th><th>পণ্যের বিবরণ</th><th class="right-align">MRP (টাকা)</th><th class="center-align">পরিমাণ</th><th class="right-align">বিক্রয় মূল্য (টাকা)</th><th class="right-align">মোট (টাকা)</th></tr></thead>
                        <tbody>${iH}</tbody>
                    </table>
                    <div class="total-section">
                        <div class="total-table">
                            <div class="total-row"><span>সাব-টোটাল:</span><span>${toBn(o.grossTotal.toFixed(2))} ৳</span></div>
                            <div class="total-row"><span>পরিশোধিত:</span><span>${toBn(o.paid.toFixed(2))} ৳</span></div>
                            <div class="total-row grand-total"><span>বকেয়া:</span><span>${toBn(o.due.toFixed(2))} ৳</span></div>
                        </div>
                    </div>
                    <div class="signature-area">
                        <div class="signature-block"><div class="signature-line"></div><div class="signature-text">গ্রাহকের স্বাক্ষর</div></div>
                        <div class="signature-block"><div class="signature-line"></div><div class="signature-text">অনুমোদিত স্বাক্ষর</div></div>
                    </div>
                    <div class="invoice-footer">
                        <p><strong>অর্ডার গ্রহণকারী (Entry By):</strong> ${o.entryBy || 'N/A'}</p>
                        <p>আমাদের সাথে থাকার জন্য ধন্যবাদ! পণ্য ক্রয়ের জন্য আবার আমন্ত্রণ জানাচ্ছি।</p>
                        <p>@RafiFoodProduct</p>
                    </div>
                </div>`; 
            };
            document.getElementById('main-content').innerHTML = `<div id="print-area"><span class="back-btn no-print" onclick="renderPage('invoices')"><< Back to Orders</span>${gC("Customer Copy")}<div class="page-break"></div>${gC("Office Copy")}<button class="print-btn no-print" onclick="window.print()">ইনভয়েস প্রিন্ট করুন / PDF সেভ করুন</button></div>`;
            window.scrollTo(0, 0);
        }

        function renderReports() {
            const tS = State.orders.reduce((s, o) => s + o.grossTotal, 0); const tC = State.orders.reduce((s, o) => s + o.paid, 0); const tD = State.users.filter(u => u.role !== 'ADMIN' && u.role !== 'SALES MAN').reduce((s, u) => s + (u.due || 0), 0);
            document.getElementById('main-content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4"><div class="win98-outset p-2"><p class="text-xs">Total Sales</p><p class="text-lg font-bold">৳ ${tS.toFixed(2)}</p></div><div class="win98-outset p-2"><p class="text-xs">Total Collection</p><p class="text-lg font-bold">৳ ${tC.toFixed(2)}</p></div><div class="win98-outset p-2"><p class="text-xs">Total Due</p><p class="text-lg font-bold">৳ ${tD.toFixed(2)}</p></div></div><div class="win98-window p-2"><div class="flex justify-between mb-2"><h3 class="font-bold">Detailed Sales Report</h3><input type="text" id="report-search" placeholder="Search..." oninput="filterReports()" class="w98-input" style="max-width: 200px;"></div><div class="win98-inset p-1 overflow-x-auto"><table class="w98-table text-xs"><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Sales</th><th>Collected</th><th>Due</th><th>Status</th><th class="text-center">View</th></tr></thead><tbody id="report-tbody"></tbody><tfoot id="report-tfoot" class="font-bold"></tfoot></table></div></div>`;
            filterReports();
        }
        function filterReports() {
            const t = (document.getElementById('report-search')?.value || '').toLowerCase(); const fO = State.orders.filter(o => (o.customerName || '').toLowerCase().includes(t) || (o.customerShopName || '').toLowerCase().includes(t) || (o.customerMobile || '').toLowerCase().includes(t));
            let gS = 0, gC = 0, gD = 0;
            const r = fO.map(o => { gS += o.grossTotal; gC += o.paid; gD += o.due; return `<tr><td>${new Date(o.orderDate).toLocaleDateString()}</td><td>${o.invoiceNo || 'N/A'}</td><td>${o.customerName}<br><span class="text-[10px]">${o.customerShopName || ''}</span></td><td>৳${o.grossTotal.toFixed(2)}</td><td>৳${o.paid.toFixed(2)}</td><td>৳${o.due.toFixed(2)}</td><td><span class="status-badge status-${o.status ? o.status.toLowerCase() : 'pending'}">${o.status || 'Pending'}</span></td><td class="text-center"><button onclick="viewInvoice('${o.id}')" class="w98-btn" style="padding: 2px 6px;">View</button></td></tr>`; }).join('') || `<tr><td colspan="8" class="text-center p-4">No records found.</td></tr>`;
            document.getElementById('report-tbody').innerHTML = r;
            document.getElementById('report-tfoot').innerHTML = `<tr><td colspan="3" class="text-right">GRAND TOTAL:</td><td>৳ ${gS.toFixed(2)}</td><td>৳ ${gC.toFixed(2)}</td><td>৳ ${gD.toFixed(2)}</td><td colspan="2"></td></tr>`;
        }
    </script>
</body>
</html>
