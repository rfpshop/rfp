<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAFI FOOD - Advanced System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#5C1D24', accent: '#D4AF37', lightbg: '#F9F6F0', darkbg: '#111827', darkcard: '#1f2937' } } } }
        const firebaseConfig = {
            apiKey: "AIzaSyBmogqpXzirZC-aUHZrFMwutSJ5fmbyDXk",
            authDomain: "e-commarcebd.firebaseapp.com",
            databaseURL: "https://e-commarcebd-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "e-commarcebd",
            storageBucket: "e-commarcebd.firebasestorage.app",
            messagingSenderId: "799252588942",
            appId: "1:799252588942:web:985396062c3a1823c6dcdf",
            measurementId: "G-FM6BH07VPM"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <style>
        :root {
            --primary-maroon: #5C1D24;
            --accent-gold: #D4AF37;
            --light-bg: #F9F6F0;
            --text-dark: #333333;
        }
        body { font-family: 'Inter', sans-serif; }
        .sidebar-link.active { background-color: var(--primary-maroon); color: var(--accent-gold); }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
        .dark ::-webkit-scrollbar-track { background: #333; }
        .dark ::-webkit-scrollbar-thumb { background: #555; }
        .modal-overlay { background: rgba(0,0,0,0.6); }
        .app-layout { display: flex; width: 100%; min-height: 100vh; }
        .main-area { flex: 1 1 0%; display: flex; flex-direction: column; }

        .brand-logo {
            width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary-maroon);
            border: 2px solid var(--accent-gold); color: var(--accent-gold); display: flex;
            align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem;
        }

        /* Invoice Specific CSS */
        .invoice-box { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 0; box-shadow: 0 0 15px rgba(0, 0, 0, 0.15); border: 2px solid #000; color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-bottom: 40px; }
        .copy-header { text-align: center; font-size: 1.2rem; font-weight: bold; color: #000; border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase; }
        .page-break { page-break-after: always; }
        
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 20px; }
        .invoice-header h2 { color: #000; font-size: 1.8rem; margin-bottom: 5px; }
        .invoice-header p { font-size: 0.9rem; color: #000; }
        .invoice-details { text-align: right; }
        .invoice-details h1 { color: #000; font-size: 1.6rem; margin-bottom: 5px; }
        .customer-info { margin-bottom: 25px; background: transparent; padding: 15px; border: 1px solid #000; border-radius: 0; }
        .customer-info h3 { font-size: 1rem; color: #000; margin-bottom: 5px; }
        .customer-info p { font-size: 0.9rem; color: #000; }
        .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        .invoice-table th, .invoice-table td { padding: 12px; text-align: left; border-bottom: 1px solid #000; font-size: 0.95rem; color: #000; }
        .invoice-table th { background-color: transparent; color: #000; border-bottom: 2px solid #000; border-top: 2px solid #000; font-weight: bold; }
        .invoice-table th.right-align, .invoice-table td.right-align { text-align: right; }
        .invoice-table th.center-align, .invoice-table td.center-align { text-align: center; }
        .invoice-table td:last-child { font-weight: 600; }
        .total-section { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .total-table { width: 300px; }
        .total-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.95rem; border-bottom: 1px solid #000; color: #000; }
        .total-row.grand-total { font-weight: bold; font-size: 1.1rem; color: #000; border-bottom: 2px solid #000; border-top: 2px solid #000; margin-top: 5px; padding: 10px 0; }
        
        .signature-area { display: flex; justify-content: space-between; margin-top: 60px; margin-bottom: 20px; }
        .signature-block { width: 45%; text-align: center; }
        .signature-line { border-top: 1px solid #000; margin-bottom: 5px; }
        .signature-text { font-size: 0.9rem; font-weight: bold; color: #000; }

        .invoice-footer { text-align: center; border-top: 1px solid #000; padding-top: 15px; font-size: 0.85rem; color: #000; }
        .print-btn { display: block; width: 100%; background-color: #000; color: #fff; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #000; font-weight: bold; text-decoration: underline; cursor: pointer; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .status-pending { background: #FEF3C7; color: #D97706; }
        .status-shipped { background: #DBEAFE; color: #2563EB; }
        .status-delivered { background: #D1FAE5; color: #059669; }
        .status-cancelled { background: #FEE2E2; color: #DC2626; }
        .status-returned { background: #E0E7FF; color: #4F46E5; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .invoice-box { box-shadow: none; border: none; margin: 0; padding: 0; border-bottom: 1px dashed #ccc; }
            
            /* Force all colors to black and background to transparent/white to save ink */
            #print-area * {
                color: #000 !important;
                background: transparent !important;
                border-color: #000 !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-darkbg text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary to-[#722F37] p-4">
        <div class="bg-white dark:bg-darkcard w-full max-w-md p-8 rounded-xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="brand-logo mx-auto mb-3" style="width: 60px; height: 60px; font-size: 2rem;">R</div>
                <h1 class="text-3xl font-bold text-primary">RAFI FOOD</h1>
                <p class="text-gray-500 dark:text-gray-400 mt-2">Sales & Distribution Management System</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700 focus:ring-2 focus:ring-primary outline-none" placeholder="admin" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg bg-gray-50 dark:bg-gray-800 dark:border-gray-700 focus:ring-2 focus:ring-primary outline-none" placeholder="admin" required>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-[#722F37] text-white font-bold py-2 rounded-lg transition">Login</button>
            </form>
        </div>
    </div>

    <!-- Main App Layout -->
    <div id="app-screen" class="hidden app-layout">
        <aside id="sidebar" class="bg-white dark:bg-darkcard w-64 space-y-6 py-7 px-4 fixed inset-y-0 left-0 z-40 transform md:translate-x-0 -translate-x-full transition duration-200 ease-in-out border-r dark:border-gray-700 overflow-y-auto">
            <div class="flex items-center space-x-2 px-2">
                <div class="brand-logo">R</div>
                <div>
                    <h1 class="text-xl font-bold text-primary dark:text-accent">RAFI FOOD</h1>
                    <p class="text-[10px] text-gray-500">Distribution System</p>
                </div>
            </div>
            <nav class="space-y-1 text-sm">
                <a href="#" data-page="dashboard" class="sidebar-link active flex items-center space-x-2 py-2.5 px-4 rounded transition hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-tachometer-alt w-5"></i> <span>Dashboard</span></a>
                <div class="pt-2 pb-1 px-4 text-[11px] uppercase font-bold text-gray-400">Sales & Distribution</div>
                <a href="#" data-page="order-entry" class="sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded transition hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-cart-plus w-5"></i> <span>Order Entry</span></a>
                <a href="#" data-page="invoices" class="sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded transition hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-file-invoice w-5"></i> <span>Order History</span></a>
                <div class="pt-2 pb-1 px-4 text-[11px] uppercase font-bold text-gray-400">Management</div>
                <a href="#" data-page="products" class="admin-only sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded transition hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-boxes w-5"></i> <span>Product Mgmt</span></a>
                <a href="#" data-page="users" class="admin-only sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded transition hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-user-shield w-5"></i> <span>User Mgmt</span></a>
                <div class="pt-2 pb-1 px-4 text-[11px] uppercase font-bold text-gray-400">Reports</div>
                <a href="#" data-page="reports" class="sidebar-link flex items-center space-x-2 py-2.5 px-4 rounded transition hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-chart-line w-5"></i> <span>Sales & Due Reports</span></a>
            </nav>
        </aside>

        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black opacity-50 z-30 md:hidden"></div>

        <div class="main-area md:ml-64">
            <header class="bg-white dark:bg-darkcard shadow-sm py-4 px-6 flex items-center justify-between sticky top-0 z-20">
                <div class="flex items-center space-x-4">
                    <button id="menu-toggle" class="md:hidden text-gray-600 dark:text-gray-300"><i class="fas fa-bars text-xl"></i></button>
                    <h2 id="page-title" class="text-xl font-semibold">Dashboard</h2>
                </div>
                <div class="flex items-center space-x-4 relative">
                    <button id="theme-toggle" class="text-gray-500 dark:text-gray-300 hover:text-primary">
                        <i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                    <div id="profile-container" class="relative">
                        <div id="profile-toggle" class="flex items-center space-x-2 cursor-pointer">
                            <img id="nav-avatar" src="https://ui-avatars.com/api/?name=Admin&background=5C1D24&color=fff" class="w-8 h-8 rounded-full" alt="User">
                            <div class="hidden md:block text-left">
                                <p class="text-sm font-medium" id="user-name">Admin</p>
                                <p class="text-xs text-gray-500" id="user-role">ADMIN</p>
                            </div>
                            <i class="fas fa-chevron-down text-xs text-gray-400 hidden md:block"></i>
                        </div>
                        <div id="profile-menu" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-darkcard rounded-md shadow-xl py-1 z-50 border dark:border-gray-700">
                            <a href="#" onclick="openProfileSettings()" class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-user-cog mr-2"></i> Profile Setting</a>
                            <a href="#" onclick="openChangePassword()" class="block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-key mr-2"></i> Change Password</a>
                            <div class="border-t dark:border-gray-700 my-1"></div>
                            <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-red-500 hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </header>
            <main id="main-content" class="flex-1 p-4 md:p-6 overflow-y-auto bg-gray-100 dark:bg-darkbg"></main>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="bg-white dark:bg-darkcard w-full max-w-lg rounded-lg shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b dark:border-gray-700 sticky top-0 bg-white dark:bg-darkcard">
                <h3 id="modal-title" class="text-lg font-semibold">Modal Title</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="p-6"></div>
        </div>
    </div>

    <script>
        const State = { currentUser: null, currentPage: null, currentView: null, products: [], users: [], orders: [], cart: [] };

        // --- AUTH ---
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username === 'admin' && password === 'admin') {
                State.currentUser = { id: 'superadmin', name: 'Super Admin', role: 'ADMIN', status: 'Active' };
                showApp(); return;
            }
            const usersRef = db.ref('users');
            usersRef.once('value', (snapshot) => {
                let loggedIn = false;
                snapshot.forEach((childSnapshot) => {
                    const user = childSnapshot.val();
                    user.id = childSnapshot.key; 
                    if (user.username === username && user.password === password) {
                        if (user.status !== 'Active') return alert('User is inactive!');
                        State.currentUser = user; loggedIn = true;
                    }
                });
                if (loggedIn) showApp(); else alert('Invalid credentials!');
            });
        });

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-name').textContent = State.currentUser.name;
            document.getElementById('user-role').textContent = State.currentUser.role;
            const avatarUrl = State.currentUser.image || `https://ui-avatars.com/api/?name=${State.currentUser.name}&background=5C1D24&color=D4AF37`;
            document.getElementById('nav-avatar').src = avatarUrl;
            if (State.currentUser.role !== 'ADMIN') document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
            else document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
            initFirebaseListeners();
            renderPage('dashboard');
        }

        function logout() { if (confirm('Are you sure you want to logout?')) location.reload(); }
        document.getElementById('profile-toggle').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('profile-menu').classList.toggle('hidden'); });
        document.addEventListener('click', (e) => { const c = document.getElementById('profile-container'); if (!c.contains(e.target)) document.getElementById('profile-menu').classList.add('hidden'); });

        function openProfileSettings() {
            const u = State.currentUser;
            openModal('Profile Settings', `
                <form onsubmit="saveProfile(event)">
                    <div class="mb-3 flex flex-col items-center">
                        <img id="u_img_preview" src="${u.image || 'https://via.placeholder.com/100'}" class="w-24 h-24 rounded-full object-cover mb-2 border-2 border-primary">
                        <input type="file" id="p_image" accept="image/*" onchange="previewUserImage(this)" class="text-xs">
                    </div>
                    <div class="mb-3"><label class="block text-sm mb-1">Full Name</label><input type="text" id="p_name" value="${u.name}" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-800" required></div>
                    <div class="mb-3"><label class="block text-sm mb-1">Mobile</label><input type="text" id="p_mobile" value="${u.mobile || ''}" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-800"></div>
                    <div class="mb-3"><label class="block text-sm mb-1">Address</label><textarea id="p_address" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-800">${u.address || ''}</textarea></div>
                    <button type="submit" class="bg-primary text-white px-4 py-2 rounded w-full">Save Changes</button>
                </form>
            `);
        }
        function previewUserImage(input) { const r = new FileReader(); r.onload = (e) => document.getElementById('u_img_preview').src = e.target.result; r.readAsDataURL(input.files[0]); }
        function saveProfile(e) {
            e.preventDefault();
            const imageFile = document.getElementById('p_image').files[0];
            const data = { name: document.getElementById('p_name').value, mobile: document.getElementById('p_mobile').value, address: document.getElementById('p_address').value };
            const saveToDB = (imgUrl) => {
                if(imgUrl) data.image = imgUrl;
                if (State.currentUser.id === 'superadmin') State.currentUser = { ...State.currentUser, ...data };
                else { db.ref('users/' + State.currentUser.id).update(data); State.currentUser = { ...State.currentUser, ...data }; }
                document.getElementById('user-name').textContent = data.name;
                if(data.image) document.getElementById('nav-avatar').src = data.image;
                alert('Profile updated successfully!'); closeModal();
            };
            if(imageFile) { const r = new FileReader(); r.onload = (e) => saveToDB(e.target.result); r.readAsDataURL(imageFile); } else { saveToDB(); }
        }
        function openChangePassword() { openModal('Change Password', `<form onsubmit="savePassword(event)"><div class="mb-3"><label class="block text-sm mb-1">New Password</label><input type="password" id="new_pass" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-800" required></div><button type="submit" class="bg-primary text-white px-4 py-2 rounded w-full">Update Password</button></form>`); }
        function savePassword(e) { e.preventDefault(); const n = document.getElementById('new_pass').value; if (State.currentUser.id === 'superadmin') alert('Super Admin password cannot be changed here.'); else { db.ref('users/' + State.currentUser.id).update({ password: n }); alert('Password updated successfully!'); } closeModal(); }

        function initFirebaseListeners() {
            db.ref('products').on('value', (s) => { State.products = []; s.forEach(c => State.products.push({ id: c.key, ...c.val() })); if (State.currentPage === 'products') renderProducts(); if (State.currentPage === 'dashboard') renderDashboard(); if (State.currentPage === 'order-entry') renderOrderEntry(); });
            db.ref('users').on('value', (s) => { State.users = []; s.forEach(c => State.users.push({ id: c.key, ...c.val() })); if (State.currentPage === 'users') renderUsers(); if (State.currentPage === 'dashboard') renderDashboard(); if (State.currentPage === 'order-entry') renderOrderEntry(); if (State.currentPage === 'reports') renderReports(); });
            db.ref('orders').on('value', (s) => { State.orders = []; s.forEach(c => State.orders.push({ id: c.key, ...c.val() })); if (State.currentPage === 'invoices' && State.currentView !== 'invoice_view') renderInvoices(); if (State.currentPage === 'reports') renderReports(); });
        }

        document.querySelectorAll('.sidebar-link').forEach(l => l.addEventListener('click', e => { e.preventDefault(); renderPage(l.dataset.page); if (window.innerWidth < 768) toggleSidebar(false); }));
        document.getElementById('menu-toggle').addEventListener('click', () => toggleSidebar(true));
        document.getElementById('sidebar-overlay').addEventListener('click', () => toggleSidebar(false));
        document.getElementById('theme-toggle').addEventListener('click', () => document.documentElement.classList.toggle('dark'));
        function toggleSidebar(s) { const sb = document.getElementById('sidebar'), ov = document.getElementById('sidebar-overlay'); if(s) { sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden'); } else { sb.classList.add('-translate-x-full'); ov.classList.add('hidden'); } }

        function renderPage(page) {
            State.currentPage = page; State.currentView = null;
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            const a = document.querySelector(`[data-page="${page}"]`); if (a) a.classList.add('active');
            document.getElementById('main-content').innerHTML = '<div class="flex justify-center items-center h-64"><i class="fas fa-spinner fa-spin text-primary text-3xl"></i></div>';
            setTimeout(() => {
                switch(page) {
                    case 'dashboard': document.getElementById('page-title').textContent = 'Dashboard'; renderDashboard(); break;
                    case 'products': document.getElementById('page-title').textContent = 'Product Management'; renderProducts(); break;
                    case 'users': document.getElementById('page-title').textContent = 'User Management'; renderUsers(); break;
                    case 'order-entry': document.getElementById('page-title').textContent = 'Order Entry'; renderOrderEntry(); break;
                    case 'invoices': document.getElementById('page-title').textContent = 'Order History'; renderInvoices(); break;
                    case 'reports': document.getElementById('page-title').textContent = 'Sales & Due Reports'; renderReports(); break;
                }
            }, 200);
        }
        function openModal(t, h) { document.getElementById('modal-title').innerText = t; document.getElementById('modal-body').innerHTML = h; document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function renderDashboard() {
            const isC = State.currentUser.role !== 'ADMIN' && State.currentUser.role !== 'SALES MAN';
            const tD = State.users.filter(u => u.role !== 'ADMIN' && u.role !== 'SALES MAN').reduce((s, u) => s + (u.due || 0), 0);
            document.getElementById('main-content').innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    ${!isC ? `
                    <div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-primary"><p class="text-gray-500 text-xs md:text-sm">Total Products</p><p class="text-xl md:text-2xl font-bold">${State.products.length}</p></div>
                    <div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-accent"><p class="text-gray-500 text-xs md:text-sm">Total Customers</p><p class="text-xl md:text-2xl font-bold">${State.users.filter(u => u.role !== 'ADMIN' && u.role !== 'SALES MAN').length}</p></div>
                    <div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-red-500"><p class="text-gray-500 text-xs md:text-sm">Total Due</p><p class="text-xl md:text-2xl font-bold">৳ ${tD}</p></div>
                    ` : `<div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-primary col-span-2 md:col-span-4"><p class="text-gray-500 text-sm">Welcome, ${State.currentUser.name}!</p><p class="text-xl font-bold mt-1">Your Current Due: ৳ ${State.currentUser.due || 0}</p></div>`}
                </div>
                <div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm"><h3 class="font-semibold mb-4">${isC ? 'My Order History' : 'Sales Overview'}</h3><canvas id="salesChart" height="100"></canvas></div>`;
            const ctx = document.getElementById('salesChart').getContext('2d');

        function saveUser(e, id) {
            e.preventDefault();
            const iF = document.getElementById('u_image').files[0];
            const val = (id) => document.getElementById(id)?.value || '';
            const role = val('u_role');
            const data = {
                username: val('u_username'), password: val('u_password'), role: role,
                name: val('u_name'), shopName: val('u_shop'), mobile: val('u_mobile'),
                altMobile: val('u_alt_mobile'), email: val('u_email'), address: val('u_address'),
                nid: val('u_nid'), businessType: val('u_b_type'), tradeLicense: val('u_trade_lic'),
                tin: val('u_tin'), designation: val('u_designation'), joinDate: val('u_join_date'),
                empStatus: val('u_emp_status'), due: parseFloat(val('u_due') || 0), status: 'Active'
            };
            const s = (u) => {
                if(u) data.image = u;
                if (id) db.ref('users/' + id).update(data);
                else {
                    const rP = { 'ADMIN': 'RFPA', 'SALES MAN': 'RFPS', 'DEALER': 'RFPD', 'HOCKER': 'RFPH', 'RETAILER': 'RFPR' };
                    const p = rP[role] || 'RFPX';
                    const rU = State.users.filter(u => u.userCode && u.userCode.startsWith(p));
                    let mS = 0; rU.forEach(u => { const s = parseInt(u.userCode.slice(p.length)); if (!isNaN(s) && s > mS) mS = s; });
                    data.userCode = `${p}${String(mS + 1).padStart(2, '0')}`;
                    db.ref('users').push(data);
                }
                closeModal();
            };
            if(iF) { const r = new FileReader(); r.onload = (e) => s(e.target.result); r.readAsDataURL(iF); } else s();
        }

                        <div class="mb-3"><label class="text-xs block mb-1">Customer</label><select id="cust_id" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-800 text-sm" ${isC ? 'disabled' : ''}>${isC ? `<option value="${State.currentUser.id}" selected>${State.currentUser.name} (${State.currentUser.role})</option>` : ''}</select></div>
                        <div class="flex-1 overflow-y-auto max-h-[30vh] border rounded p-2 mb-3 dark:border-gray-700"><table class="w-full text-xs text-left"><tbody id="cart-table"><tr><td colspan="3" class="text-center text-gray-500 py-4">Cart is empty</td></tr></tbody></table></div>
                        <div class="space-y-1 text-sm border-t pt-3 dark:border-gray-700"><div class="flex justify-between"><span>Gross Total:</span> <span id="gross_total" class="font-semibold">৳ 0.00</span></div><div class="flex justify-between"><span>Paid Amount:</span> <input type="number" id="paid_amt" value="0" oninput="calcDue()" class="w-24 p-1 border rounded bg-gray-50 dark:bg-gray-800 text-right"></div><div class="flex justify-between font-bold text-primary text-base"><span>Current Due:</span> <span id="final_due">৳ 0.00</span></div></div>
                        <button onclick="submitOrder()" class="bg-primary text-white p-2 rounded w-full mt-4 hover:bg-[#722F37]">Submit Order</button>
                    </div>
                </div>`;
            handleCustomerTypeChange(); 
        }
        function handleCustomerTypeChange() { const t = document.getElementById('cust_type').value; const isC = State.currentUser.role !== 'ADMIN' && State.currentUser.role !== 'SALES MAN'; if (isC) return; const fC = State.users.filter(u => u.role === t); const cS = document.getElementById('cust_id'); cS.innerHTML = fC.length ? fC.map(c => `<option value="${c.id}">${c.name} - ${c.shopName || c.mobile || 'N/A'}</option>`).join('') : '<option value="">No customers found</option>'; updatePrices(); }
        function updatePrices() { const t = document.getElementById('cust_type').value; State.products.forEach(p => { let pr = p.mrp; if(t === 'RETAILER') pr = p.rPrice; if(t === 'DEALER') pr = p.dPrice; if(t === 'HOCKER') pr = p.hPrice; const el = document.getElementById(`price_${p.id}`); if(el) el.innerText = pr; }); renderCart(); }
        function getActivePrice(p) { const t = document.getElementById('cust_type').value; if(t === 'RETAILER') return p.rPrice; if(t === 'DEALER') return p.dPrice; if(t === 'HOCKER') return p.hPrice; return p.mrp; }
        function addToCart(id) { const p = State.products.find(x => x.id === id); const e = State.cart.find(i => i.id === id); if(e) e.qty++; else State.cart.push({ id: id, name: p.name, price: getActivePrice(p), qty: 1, mrp: p.mrp }); renderCart(); calcDue(); }
        function changeQty(id, a) { let i = State.cart.find(x => x.id === id); if(i) { if(a === 'inc') i.qty++; if(a === 'dec') i.qty--; if(i.qty <= 0) State.cart = State.cart.filter(x => x.id !== id); } renderCart(); calcDue(); }
        function renderCart() { const cT = document.getElementById('cart-table'); if(!cT) return; if(State.cart.length === 0) cT.innerHTML = `<tr><td colspan="3" class="text-center text-gray-500 py-4">Cart is empty</td></tr>`; else cT.innerHTML = State.cart.map(i => `<tr class="border-b dark:border-gray-700"><td class="py-1">${i.name}</td><td class="py-1 text-center"><button onclick="changeQty('${i.id}', 'dec')" class="text-red-500 px-1">-</button> ${i.qty} <button onclick="changeQty('${i.id}', 'inc')" class="text-green-500 px-1">+</button></td><td class="py-1 text-right">৳${i.qty * i.price}</td></tr>`).join(''); let g = State.cart.reduce((s, i) => s + (i.qty * i.price), 0); document.getElementById('gross_total').innerText = `৳ ${g.toFixed(2)}`; }
        function calcDue() { let g = State.cart.reduce((s, i) => s + (i.qty * i.price), 0); let p = parseFloat(document.getElementById('paid_amt').value) || 0; document.getElementById('final_due').innerText = `৳ ${(g - p).toFixed(2)}`; }
        function generateInvoiceNo() { const n = new Date(); const y = n.getFullYear(); const m = String(n.getMonth() + 1).padStart(2, '0'); const p = `RFP${y}${m}`; const mO = State.orders.filter(o => o.invoiceNo && o.invoiceNo.startsWith(p)); let mS = 0; mO.forEach(o => { const s = parseInt(o.invoiceNo.slice(-2)); if (s > mS) mS = s; }); return `${p}${String(mS + 1).padStart(2, '0')}`; }
        function submitOrder() {
            if(State.cart.length === 0) return alert('Cart is empty!');
            const cId = document.getElementById('cust_id').value; const c = State.users.find(u => u.id === cId); if(!c) return alert('Please select a customer!');
            const g = State.cart.reduce((s, i) => s + (i.qty * i.price), 0); const p = parseFloat(document.getElementById('paid_amt').value) || 0; const d = g - p;
            const oD = { 
                invoiceNo: generateInvoiceNo(), 
                customerId: cId, customerName: c.name, customerShopName: c.shopName || 'N/A', 
                customerMobile: c.mobile || 'N/A', customerAddress: c.address || 'N/A', 
                customerType: document.getElementById('cust_type').value, items: State.cart, 
                grossTotal: g, paid: p, due: d, orderDate: new Date().toISOString(), status: 'Pending',
                entryBy: State.currentUser.userCode || State.currentUser.name // Added User ID who placed the order
            };
            db.ref('orders').push(oD).then(() => { const nD = (c.due || 0) + d; db.ref('users/' + cId).update({ due: nD }); alert('Order Saved Successfully! Invoice No: ' + oD.invoiceNo); renderPage('invoices'); });
        }

        function renderInvoices() {
            const iA = ['ADMIN', 'SALES MAN'].includes(State.currentUser.role); let oS = State.orders; if (!iA) oS = State.orders.filter(o => o.customerId === State.currentUser.id);
            const sC = (s) => `status-${s ? s.toLowerCase() : 'pending'}`;
            const r = oS.length ? oS.map(o => `<tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800"><td class="p-2 font-medium text-primary">${o.invoiceNo || 'N/A'}</td><td class="p-2">${new Date(o.orderDate).toLocaleDateString()}</td>${iA ? `<td class="p-2">${o.customerName}</td>` : ''}<td class="p-2">৳${o.grossTotal}</td><td class="p-2">৳${o.due}</td><td class="p-2 text-center">${iA ? `<select onchange="updateStatus('${o.id}', this.value)" class="p-1 border rounded bg-gray-50 dark:bg-gray-800 text-xs"><option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option><option value="Shipped" ${o.status==='Shipped'?'selected':''}>Shipped</option><option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option><option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select>` : `<span class="status-badge ${sC(o.status)}">${o.status || 'Pending'}</span>`}</td><td class="p-2 text-center whitespace-nowrap"><button onclick="viewInvoice('${o.id}')" class="bg-primary text-white px-3 py-1 rounded text-xs">View</button>${iA ? `<button onclick="processReturn('${o.id}')" class="bg-yellow-500 text-white px-3 py-1 rounded text-xs ml-1">Return</button>` : ''}${State.currentUser.role === 'ADMIN' ? `<button onclick="deleteOrder('${o.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-xs ml-1">Delete</button>` : ''}</td></tr>`).join('') : `<tr><td colspan="7" class="text-center p-4 text-gray-500">No orders found.</td></tr>`;
            document.getElementById('main-content').innerHTML = `<div class="bg-white dark:bg-darkcard p-4 md:p-6 rounded-lg shadow-sm overflow-x-auto"><h3 class="text-lg font-semibold mb-4">Order History</h3><table class="w-full text-sm text-left min-w-[600px]"><thead class="bg-gray-50 dark:bg-gray-800 text-xs uppercase"><tr><th class="p-2">Invoice No</th><th class="p-2">Date</th>${iA ? '<th class="p-2">Customer</th>' : ''}<th class="p-2">Total</th><th class="p-2">Due</th><th class="p-2 text-center">Status</th><th class="p-2 text-center">Action</th></tr></thead><tbody>${r}</tbody></table></div>`;
        }
        function updateStatus(id, s) { db.ref('orders/' + id).update({ status: s }); alert(`Order status updated to: ${s}`); }
        function processReturn(id) {
            const o = State.orders.find(x => x.id === id); if(!o) return alert('Order not found!');
            const iH = o.items.map((i, idx) => `<tr><td class="p-2">${i.name}</td><td class="p-2 text-center">${i.qty}</td><td class="p-2 text-center"><input type="number" id="ret_qty_${idx}" min="0" max="${i.qty}" value="0" class="w-16 p-1 border rounded bg-gray-50 dark:bg-gray-800 text-center"></td></tr>`).join('');
            openModal('Process Return / Adjustment', `<p class="text-sm text-gray-500 mb-4">Enter returned quantity for each item. The total and customer due will be adjusted automatically.</p><form onsubmit="submitReturn(event, '${id}')"><table class="w-full text-sm text-left mb-4 border dark:border-gray-700"><thead class="bg-gray-100 dark:bg-gray-800"><tr><th class="p-2">Product</th><th class="p-2 text-center">Ordered Qty</th><th class="p-2 text-center">Return Qty</th></tr></thead><tbody>${iH}</tbody></table><button type="submit" class="bg-primary text-white px-4 py-2 rounded w-full">Confirm Return</button></form>`);
        }
        function submitReturn(e, id) {
            e.preventDefault(); const o = State.orders.find(x => x.id === id); if(!o) return;
            let nG = 0, hR = false; const uI = o.items.map((i, idx) => { const rQ = parseInt(document.getElementById(`ret_qty_${idx}`).value) || 0; if(rQ > 0) hR = true; if(rQ > i.qty) { alert(`Return quantity cannot exceed ordered quantity for ${i.name}`); throw new Error('Invalid'); } const nQ = i.qty - rQ; nG += (nQ * i.price); return { ...i, qty: nQ }; });
            if(!hR) return alert('No return quantity entered.');
            const rA = o.grossTotal - nG; const nD = o.due - rA;
            if (o.customerId) { const c = State.users.find(u => u.id === o.customerId); if (c) { const nCD = (c.due || 0) - rA; db.ref('users/' + c.id).update({ due: nCD }); } }
            db.ref('orders/' + id).update({ items: uI, grossTotal: nG, due: nD, status: 'Returned' }).then(() => { alert('Return processed successfully! Amount adjusted.'); closeModal(); renderPage('invoices'); });
        }
        function deleteOrder(id) { const o = State.orders.find(x => x.id === id); if (!o) return alert('Order not found!'); if (confirm(`Are you sure you want to delete Invoice ${o.invoiceNo}? This will also adjust customer due.`)) { if (o.customerId && o.due) { const c = State.users.find(u => u.id === o.customerId); if (c) { const nD = (c.due || 0) - o.due; db.ref('users/' + c.id).update({ due: nD }); } } db.ref('orders/' + id).remove().then(() => { alert('Order deleted successfully!'); if (State.currentView === 'invoice_view') renderPage('invoices'); }); } }
        function toBn(n) { const b = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯']; return String(n).replace(/[0-9]/g, d => b[d]); }
        function formatBnDate(d) { const t = new Date(d); const m = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর']; return `${toBn(t.getDate())} ${m[t.getMonth()]}, ${toBn(t.getFullYear())}`; }
        function translateStatus(s) { const m = { 'Pending': 'পেন্ডিং', 'Shipped': 'প্রেরিত', 'Delivered': 'ডেলিভার্ড', 'Cancelled': 'বাতিল', 'Returned': 'রিটার্ন/এডজাস্টেড' }; return m[s] || 'পেন্ডিং'; }
        function viewInvoice(id) {
            State.currentView = 'invoice_view'; const o = State.orders.find(x => x.id === id); if(!o) return alert('Invoice not found!');
            const gC = (t) => { 
                const iH = o.items.map((i, idx) => `<tr><td class="center-align">${toBn(idx + 1)}</td><td>${i.name}</td><td class="right-align">${toBn(i.mrp.toFixed(2))}</td><td class="center-align">${toBn(i.qty)}</td><td class="right-align">${toBn(i.price.toFixed(2))}</td><td class="right-align">${toBn((i.qty * i.price).toFixed(2))}</td></tr>`).join(''); 
                return `
                <div class="invoice-box">
                    <h2 class="copy-header">${t}</h2>
                    <div class="invoice-header">
                        <div class="company-info">
                            <h2>Rafi Food Product</h2>
                            <p>প্রিমিয়াম কোয়ালিটি বেকারি ও ফুড আইটেম</p>
                            <p>ঠিকানা: Mosjid para Chuadanga, Chuadanga sadar-7200</p>
                            <p>ফোন: +৮৮০ 1756144900</p>
                            <p>ইমেইল: rafifoodproducts@gmail.com</p>
                        </div>
                        <div class="invoice-details">
                            <h1>INVOICE</h1>
                            <p><strong>ইনভয়েস নম্বর:</strong> ${o.invoiceNo || 'N/A'}</p>
                            <p><strong>তারিখ:</strong> ${formatBnDate(o.orderDate)}</p>
                            <p><strong>স্ট্যাটাস:</strong> ${translateStatus(o.status)}</p>
                        </div>
                    </div>
                    <div class="customer-info">
                        <h3>গ্রাহকের বিবরণ:</h3>
                        <p><strong>নাম:</strong> ${o.customerName}</p>
                        <p><strong>দোকানের নাম:</strong> ${o.customerShopName}</p>
                        <p><strong>ঠিকানা:</strong> ${o.customerAddress}</p>
                        <p><strong>মোবাইল:</strong> ${toBn(o.customerMobile)}</p>
                    </div>
                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th class="center-align">SL</th>
                                <th>পণ্যের বিবরণ</th>
                                <th class="right-align">MRP (টাকা)</th>
                                <th class="center-align">পরিমাণ</th>
                                <th class="right-align">বিক্রয় মূল্য (টাকা)</th>
                                <th class="right-align">মোট (টাকা)</th>
                            </tr>
                        </thead>
                        <tbody>${iH}</tbody>
                    </table>
                    <div class="total-section">
                        <div class="total-table">
                            <div class="total-row"><span>সাব-টোটাল:</span><span>${toBn(o.grossTotal.toFixed(2))} ৳</span></div>
                            <div class="total-row"><span>পরিশোধিত:</span><span>${toBn(o.paid.toFixed(2))} ৳</span></div>
                            <div class="total-row grand-total"><span>বকেয়া:</span><span>${toBn(o.due.toFixed(2))} ৳</span></div>
                        </div>
                    </div>
                    <div class="signature-area">
                        <div class="signature-block">
                            <div class="signature-line"></div>
                            <div class="signature-text">গ্রাহকের স্বাক্ষর</div>
                        </div>
                        <div class="signature-block">
                            <div class="signature-line"></div>
                            <div class="signature-text">অনুমোদিত স্বাক্ষর</div>
                        </div>
                    </div>
                    <div class="invoice-footer">
                        <p><strong>অর্ডার গ্রহণকারী (Entry By):</strong> ${o.entryBy || 'N/A'}</p>
                        <p>আমাদের সাথে থাকার জন্য ধন্যবাদ! পণ্য ক্রয়ের জন্য আবার আমন্ত্রণ জানাচ্ছি।</p>
                        <p>@RafiFoodProduct</p>
                    </div>
                </div>`; 
            };
            document.getElementById('main-content').innerHTML = `<div id="print-area"><span class="back-btn no-print" onclick="renderPage('invoices')"><i class="fas fa-arrow-left"></i> Back to Orders</span>${gC("Customer Copy")}<div class="page-break"></div>${gC("Office Copy")}<button class="print-btn no-print" onclick="window.print()">ইনভয়েস প্রিন্ট করুন / PDF সেভ করুন</button></div>`;
            window.scrollTo(0, 0);
        }

        function renderReports() {
            const tS = State.orders.reduce((s, o) => s + o.grossTotal, 0); const tC = State.orders.reduce((s, o) => s + o.paid, 0); const tD = State.users.filter(u => u.role !== 'ADMIN' && u.role !== 'SALES MAN').reduce((s, u) => s + (u.due || 0), 0);
            document.getElementById('main-content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"><div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-primary"><p class="text-gray-500 text-sm">Total Sales</p><p class="text-2xl font-bold text-primary">৳ ${tS.toFixed(2)}</p></div><div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-accent"><p class="text-gray-500 text-sm">Total Collection</p><p class="text-2xl font-bold text-accent">৳ ${tC.toFixed(2)}</p></div><div class="bg-white dark:bg-darkcard p-4 rounded-lg shadow-sm border-l-4 border-red-500"><p class="text-gray-500 text-sm">Total Outstanding Due</p><p class="text-2xl font-bold text-red-500">৳ ${tD.toFixed(2)}</p></div></div><div class="bg-white dark:bg-darkcard p-4 md:p-6 rounded-lg shadow-sm overflow-x-auto"><div class="flex flex-col md:flex-row justify-between md:items-center mb-4 gap-2"><h3 class="text-lg font-semibold">Detailed Sales Report</h3><input type="text" id="report-search" placeholder="Search by customer/shop/mobile..." oninput="filterReports()" class="p-2 border rounded bg-gray-50 dark:bg-gray-800 text-sm w-full md:w-64"></div><table class="w-full text-sm text-left min-w-[800px]"><thead class="bg-gray-50 dark:bg-gray-800 text-xs uppercase"><tr><th class="p-2">Date</th><th class="p-2">Invoice</th><th class="p-2">Customer</th><th class="p-2">Sales</th><th class="p-2">Collected</th><th class="p-2">Due</th><th class="p-2">Status</th><th class="p-2 text-center">View</th></tr></thead><tbody id="report-tbody"></tbody><tfoot id="report-tfoot" class="bg-gray-50 dark:bg-gray-800 font-bold"></tfoot></table></div>`;
            filterReports();
        }
        function filterReports() {
            const t = (document.getElementById('report-search')?.value || '').toLowerCase(); const fO = State.orders.filter(o => (o.customerName || '').toLowerCase().includes(t) || (o.customerShopName || '').toLowerCase().includes(t) || (o.customerMobile || '').toLowerCase().includes(t));
            let gS = 0, gC = 0, gD = 0;
            const r = fO.map(o => { gS += o.grossTotal; gC += o.paid; gD += o.due; return `<tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800"><td class="p-2">${new Date(o.orderDate).toLocaleDateString()}</td><td class="p-2 font-medium text-primary">${o.invoiceNo || 'N/A'}</td><td class="p-2">${o.customerName}<br><span class="text-xs text-gray-500">${o.customerShopName || ''}</span></td><td class="p-2">৳${o.grossTotal.toFixed(2)}</td><td class="p-2">৳${o.paid.toFixed(2)}</td><td class="p-2">৳${o.due.toFixed(2)}</td><td class="p-2"><span class="status-badge status-${o.status ? o.status.toLowerCase() : 'pending'}">${o.status || 'Pending'}</span></td><td class="p-2 text-center"><button onclick="viewInvoice('${o.id}')" class="text-blue-500 hover:text-blue-700 text-lg" title="View Invoice"><i class="fas fa-eye"></i></button></td></tr>`; }).join('') || `<tr><td colspan="8" class="text-center p-4 text-gray-500">No matching records found.</td></tr>`;
            document.getElementById('report-tbody').innerHTML = r;
            document.getElementById('report-tfoot').innerHTML = `<tr><td colspan="3" class="p-2 text-right">GRAND TOTAL:</td><td class="p-2 text-primary">৳ ${gS.toFixed(2)}</td><td class="p-2 text-accent">৳ ${gC.toFixed(2)}</td><td class="p-2 text-red-500">৳ ${gD.toFixed(2)}</td><td colspan="2"></td></tr>`;
        }
    </script>
</body>
</html>
